name: Package sandbox probe

# One-off investigation (Opus decision, 2026-11-02): can the ADR-0004 sandbox run the engine from a real installed MSIX under
# WindowsApps? Runs only for the branch m1/sandbox-probe. The job signs a TEST package with an ephemeral self-signed certificate
# and trusts it on this throwaway GitHub-hosted runner. Nothing here is a release path and no key is ever stored.
on:
  push:
    branches: ['m1/sandbox-probe']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025-vs2026
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Build the engine and the sandbox probe (native, tests on)
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Arch x64 -SkipManaged -Test
      - name: Build the test package
        shell: pwsh
        run: ./build/sandbox-probe/make-package.ps1 -Arch x64
      - name: Install the package and run the probe (Windows PowerShell)
        shell: powershell
        run: ./build/sandbox-probe/install-and-run.ps1 -Msix "$env:GITHUB_WORKSPACE\build\out\probe\Quire.SandboxProbe.msix" -OutDir "$env:GITHUB_WORKSPACE\build\out\probe-results" -Workspace "$env:GITHUB_WORKSPACE"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-sandbox-probe
          path: build/out/probe-results/**
          if-no-files-found: warn
