name: Performance

# Master prompt 15.1 step 7 and section 11: the headless performance suite against the real sandboxed engine, on every PR, compared with a
# per-runner baseline in docs/perf/baselines. A regression of more than 10% (after the retries described in docs/perf/README.md) fails the job.
#
# GitHub-hosted runners are shared virtual machines and are NOT reference hardware (R-09, R-17, R-19). This job catches regressions against its
# own baseline; it says nothing about whether a section 11 budget is met. That needs R1, R2 and R3.

on:
  pull_request:
  push:
    branches: [main, 'm[0-9]*/**']
  schedule:
    # Nightly, so the noise of the hosted runners shows up in artifacts before it shows up in a failed PR.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels are pinned explicitly, never *-latest (ADR-0001). Baselines are per runner and per CPU: docs/perf/baselines/ci-<arch>.<cpu>.json.
          - arch: x64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx' # ADR-0001 pin (10.0.403); global.json rolls forward to it
      - name: Build the engine (native half)
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Arch ${{ matrix.arch }} -SkipManaged
      - name: Build the harness
        shell: pwsh
        run: dotnet build tools/MikePDF.Perf/MikePDF.Perf.csproj -c Release -p:MikePDFArch=${{ matrix.arch }}
      - name: Stop the compiler servers
        # They are still winding down after the build; the harness would be timing them. (It also waits for the machine to be under 15% busy.)
        shell: pwsh
        run: dotnet build-server shutdown
      - name: Measure and compare with the baseline
        shell: pwsh
        run: |
          $tool = (Get-ChildItem tools/MikePDF.Perf/bin/Release -Recurse -Filter MikePDF.Perf.exe | Select-Object -First 1).FullName
          # Exit codes: 0 passed (or no baseline yet), 1 regression, 2 bad usage, 3 a metric could not be measured.
          & $tool gate --profile ci --runner-id ci-${{ matrix.arch }} --baseline-dir docs/perf/baselines --out perf-results
          exit $LASTEXITCODE
      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path perf-results/perf-results.md) { Get-Content perf-results/perf-results.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # perf-results.json is also the candidate baseline: commit it as docs/perf/baselines/ci-<arch>.<cpu>.json (the job output names the file) after review.
          name: perf-results-${{ matrix.arch }}
          path: perf-results/**
          if-no-files-found: warn
