name: S6b shell transport probe

# Spike S6b (docs/spikes/S6b-shell-transport.md). Builds a TEST-ONLY package with packaged shell handlers, a COM ExeServer, ShellHost and the real engine, installs it on a
# disposable GitHub-hosted runner with an ephemeral self-signed certificate, and runs the real shell paths against it. Never runs on a developer machine.
on:
  workflow_dispatch:
  push:
    branches: ['m3/spike-shell']
    paths:
      - 'spikes/S6b/**'
      - '.github/workflows/s6b-shell-transport.yml'

permissions:
  contents: read

concurrency:
  group: s6b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: s6b-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx' # ADR-0001 pin (10.0.403); global.json rolls forward to it
      - name: Build the engine (native only)
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Arch ${{ matrix.arch }} -SkipManaged
      - name: Build the handler DLL, the test host, the driver and the COM server
        shell: pwsh
        run: ./spikes/S6b/native/build.ps1 -Arch ${{ matrix.arch }} -Ci
      - name: Publish ShellHost (self-contained)
        shell: pwsh
        run: |
          dotnet publish spikes/S6b/ShellHost/S6bShellHost.csproj -c Release -r win-${{ matrix.arch }} --self-contained -p:MikePDFArch=${{ matrix.arch }} -o spikes/S6b/out/shellhost-publish-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate the test PDF
        continue-on-error: true
        shell: pwsh
        run: python spikes/S6b/gen_pdfs.py spikes/S6b/out/pdfs
      - name: Build the test package
        id: pkg
        shell: pwsh
        run: |
          $msix = ./spikes/S6b/ci/make-package.ps1 -Arch ${{ matrix.arch }} | Select-Object -Last 1
          "msix=$msix" | Add-Content $env:GITHUB_OUTPUT
      - name: Install and run the probe (Windows PowerShell 5.1)
        shell: powershell
        run: ./spikes/S6b/ci/install-and-run.ps1 -Msix "${{ steps.pkg.outputs.msix }}" -OutDir "$env:GITHUB_WORKSPACE\s6b-results-${{ matrix.arch }}" -NativeDir "$env:GITHUB_WORKSPACE\spikes\S6b\out\native-${{ matrix.arch }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s6b-results-${{ matrix.arch }}
          path: s6b-results-${{ matrix.arch }}/**
          if-no-files-found: warn
