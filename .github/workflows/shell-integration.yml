name: Shell integration

# The S6b hosted-runner probe (docs/spikes/S6b-shell-transport.md) as a real integration job (docs/features/shell-extensions.md section 14, ADR-0018 "Verification"). It builds the
# real MikePDF package, installs it on a disposable GitHub-hosted runner with an ephemeral self-signed certificate, and drives the REAL shell: thumbnails through
# IShellItemImageFactory, the preview handler as Explorer's host activates it, ShellHost's pipe and its security, the user switch, the enterprise policy and what the shell shows
# when MikePDF's handler declines (OQ-SHELL-14). Then it uninstalls the package and checks that nothing of the handlers is left.
#
# Registry writes (the policy values and a competing handler under HKLM) happen only here, only on a GitHub-hosted runner: install-test.ps1 and the probe both refuse to run
# unless GITHUB_ACTIONS is 'true' and RUNNER_ENVIRONMENT is 'github-hosted'. Nothing is ever registered on a developer machine.
#
# When it runs: on every push to main (always, so the branch that everything merges into is never unchecked); on a pull request that touches the shell, the engine, the protocol,
# the package manifest, the broker or the package scripts; on a push to a milestone branch (m0/..., m1/...) that touches the same paths; and by hand. A push trigger has one
# filter for all its branches, so the path test for milestone branches is the `scope` job below, and main is exempt from it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/MikePDF.ShellExt/**'
      - 'src/MikePDF.ShellHost/**'
      - 'src/MikePDF.App/Package.appxmanifest'
      - 'src/MikePDF.Engine/**'
      - 'src/MikePDF.Broker/**'
      - 'src/MikePDF.Protocol/**'
      - 'tests/MikePDF.ShellExt.Tests/**'
      - 'build/package.ps1'
      - 'build/store/install-test.ps1'
      - '.github/workflows/shell-integration.yml'
  push:
    branches: [main, 'm[0-9]*/**']

permissions:
  contents: read

concurrency:
  # A manual run has a group of its own, so that several can be started side by side (to repeat a flaky check) and none cancels another.
  group: shell-integration-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  # A newer push to a branch supersedes the older run; main's runs are each kept, so that a result is never lost to the next merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether the shell job runs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^(src/MikePDF\.(ShellExt|ShellHost|Engine|Broker|Protocol)/|src/MikePDF\.App/Package\.appxmanifest$|tests/MikePDF\.ShellExt\.Tests/|build/package\.ps1$|build/store/install-test\.ps1$|\.github/workflows/shell-integration\.yml$)' || true)
            if [ -z "$changed" ]; then run=false; fi
          fi
          echo "event=$EVENT ref=$REF run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  shell:
    name: shell-${{ matrix.arch }}
    needs: scope
    if: needs.scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels are pinned explicitly, never *-latest (ADR-0001).
          - arch: x64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403' # ADR-0001 pin: SDK 10.0.403 carries runtime 10.0.14 (CVE-2026-111497 fix); same as global.json
      - name: Build the native half (engine, handler DLL, probe) and run the native tests
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Arch ${{ matrix.arch }} -SkipManaged -Test
      - name: Build the real package (release, no self-test, ShellHost Native AOT)
        shell: pwsh
        run: ./build/package.ps1 -Arch ${{ matrix.arch }} -Version 1.0.0.0 -SkipNativeBuild
      - name: Install it on this disposable runner and drive the real shell
        shell: powershell
        run: |
          ./build/store/install-test.ps1 -Mode Shell -Arch ${{ matrix.arch }} `
            -Msix "build/out/package/MikePDF_1.0.0.0_${{ matrix.arch }}.msix" `
            -OutDir "$env:GITHUB_WORKSPACE\shell-results-${{ matrix.arch }}" `
            -ProbeDir "$env:GITHUB_WORKSPACE\build\out\cmake-${{ matrix.arch }}\bin\Release" `
            -Fixtures "$env:GITHUB_WORKSPACE\tests\MikePDF.Integration.Tests\Fixtures"
      - name: Upload the probe's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-results-${{ matrix.arch }}
          path: shell-results-${{ matrix.arch }}/**
          if-no-files-found: warn
