name: UI probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/ui-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    name: probe-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025-vs2026 }
          - { arch: arm64, runner: windows-11-vs2026-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Processes and windows
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.SessionId -eq 2 -and ($_.MainWindowTitle -or $_.ProcessName -match 'Experience|OOBE|Cloud|Out|Setup|Privacy|ShellExperience|LockApp') } | Select-Object Id, ProcessName, MainWindowTitle, SessionId | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host '--- all process names in session 2'
          (Get-Process | Where-Object SessionId -eq 2 | Select-Object -ExpandProperty ProcessName | Sort-Object -Unique) -join ', '
      - name: Try to get rid of the OOBE page
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency, dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            static DEVMODE Fresh() { var dm = new DEVMODE(); dm.dmDeviceName = ""; dm.dmFormName = ""; dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE)); return dm; }
            public static string Modes() {
              var seen = new SortedSet<string>(); var dm = Fresh();
              if (EnumDisplaySettings(null, -1, ref dm)) seen.Add("current " + dm.dmPelsWidth + "x" + dm.dmPelsHeight + "x" + dm.dmBitsPerPel); else seen.Add("current: enum failed");
              for (int i = 0; ; i++) { dm = Fresh(); if (!EnumDisplaySettings(null, i, ref dm)) break; seen.Add(dm.dmPelsWidth + "x" + dm.dmPelsHeight + "x" + dm.dmBitsPerPel); }
              return string.Join(" ", seen);
            }
            public static int Set(int w, int h) { var dm = Fresh(); EnumDisplaySettings(null, -1, ref dm); dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000; return ChangeDisplaySettings(ref dm, 0); }
          }
          '@
          function Shot($name) {
            New-Item -ItemType Directory -Force probe | Out-Null
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bm = [System.Drawing.Bitmap]::new($b.Width, $b.Height)
            [System.Drawing.Graphics]::FromImage($bm).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bm.Save((Join-Path $PWD "probe/$name.png"))
          }
          Write-Host ("Modes: " + [W]::Modes())
          foreach ($size in @(@(1920,1080), @(1600,900), @(1366,768), @(1280,1024), @(1280,800))) {
            $r = [W]::Set($size[0], $size[1]); Write-Host "ChangeDisplaySettings $($size[0])x$($size[1]) -> $r"
            if ($r -eq 0) { break }
          }
          Start-Sleep -Seconds 2
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; Write-Host "Screen now $($scr.Width)x$($scr.Height)"
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class M { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, UIntPtr e); }
          '@
          function Click($x, $y) { [void][M]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 300; [M]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); [M]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero) }
          Shot 'a-before'
          Click ([int]($scr.Width * 0.65)) ([int]($scr.Height * 0.22))
          Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 4
          Shot 'b-after-enter-1'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 4
          Shot 'c-after-enter-2'
          Write-Host ("webview2 processes: " + @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 4
          Shot 'd-after-kill-webview2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.arch }}
          path: probe/**
          if-no-files-found: warn
